name: PWA installability checks

on:
  push:
    branches: [Alpha-PWA-Install-Test]
  pull_request:
    branches: [Alpha-PWA-Install-Test]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Run lint
        run: npm run lint
