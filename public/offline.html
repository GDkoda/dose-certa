<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b5b">
  <title>Sem conexão — Dose Certa</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7faf8;color:#18332d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,420px);padding:32px;border-radius:28px;background:white;box-shadow:0 12px 40px #18332d12;text-align:center}.mark{display:grid;place-items:center;margin:0 auto 20px;width:72px;height:72px;border-radius:22px;background:#176b5b;color:white;font-size:38px;font-weight:700}.muted{color:#58716a;line-height:1.6}button{border:0;border-radius:14px;background:#176b5b;color:white;font:inherit;font-weight:700;padding:13px 18px;cursor:pointer}
  </style>
</head>
<body><main class="card"><div class="mark" aria-hidden="true">+</div><h1>Você está sem conexão</h1><p class="muted">O Dose Certa precisa de internet para carregar seus dados com segurança. Confira sua conexão e tente novamente.</p><button onclick="location.reload()">Tentar novamente</button></main></body>
</html>
